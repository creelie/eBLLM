<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" role="img" aria-label="The amplified round: composites bred, closed, accepted and surviving"><rect width="620" height="380" rx="18" fill="#f8fafc" stroke="#e2e8f0"/><text x="28.0" y="42.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start" >The amplified round</text><text x="28.0" y="68.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" >Yang–Mills and Hodge libraries crossed to depth four;</text><text x="28.0" y="87.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" >the check and the refuter decide what counts.</text><rect x="210" y="124" width="324.5" height="30" rx="7" fill="#94a3b8" fill-opacity="0.85"/><text x="198.0" y="144.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="end" >bred</text><text x="542.5" y="144.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start" >21,515</text><rect x="210" y="176" width="210.9" height="30" rx="7" fill="#2563eb" fill-opacity="0.85"/><text x="198.0" y="196.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="end" >closed</text><text x="428.9" y="196.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start" >1,466</text><rect x="210" y="228" width="96.9" height="30" rx="7" fill="#0d9488" fill-opacity="0.85"/><text x="198.0" y="248.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="end" >accepted by the check</text><text x="314.9" y="248.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start" >99</text><rect x="210" y="280" width="78.5" height="30" rx="7" fill="#7c3aed" fill-opacity="0.85"/><text x="198.0" y="300.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="end" >survived the refuter</text><text x="296.5" y="300.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start" >64</text><text x="28.0" y="348.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >Of the closed ones 934 stop without a checkable form and 433 are rejected;</text><text x="28.0" y="367.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >the refuter breaks 35, as weaker than a known range or a repeat. Log scale.</text></svg>
