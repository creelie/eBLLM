<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" role="img" aria-label="The amplified round: composites bred, closed, accepted and surviving"><style>@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes rise{from{transform:scaleX(0)}to{transform:scaleX(1)}}[marker-end]{stroke-dasharray:8 6;animation:flow 1.4s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.rise{transform-box:fill-box;transform-origin:left;animation:rise 1.8s cubic-bezier(.2,.8,.2,1) both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 12s linear infinite}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.fade{animation:fade .9s cubic-bezier(.2,.8,.2,1) both}@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}.sweep{transform-box:fill-box;animation:sweep 7s ease-in-out infinite}@keyframes march{to{stroke-dashoffset:-24}}.march{stroke-dasharray:3 9;animation:march 2s linear infinite}</style><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0!important}.ping,.sweep{display:none}}</style><rect width="620" height="380" rx="18" fill="#f8fafc" stroke="#e2e8f0"/><text x="28.0" y="42.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start" >The amplified round</text><text x="28.0" y="68.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" >Yang–Mills and Hodge libraries crossed to depth four;</text><text x="28.0" y="87.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" >the check and the refuter decide what counts.</text><rect class="rise" x="210" y="124" width="324.5" height="30" rx="7" fill="#94a3b8" fill-opacity="0.85" style="animation-delay:0.00s"/><text x="198.0" y="144.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="end" >bred</text><text x="542.5" y="144.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start" class="fade" style="animation-delay:1.00s">21,515</text><rect class="rise" x="210" y="176" width="210.9" height="30" rx="7" fill="#2563eb" fill-opacity="0.85" style="animation-delay:0.25s"/><text x="198.0" y="196.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="end" >closed</text><text x="428.9" y="196.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start" class="fade" style="animation-delay:1.25s">1,466</text><rect class="rise" x="210" y="228" width="96.9" height="30" rx="7" fill="#0d9488" fill-opacity="0.85" style="animation-delay:0.50s"/><text x="198.0" y="248.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="end" >accepted by the check</text><text x="314.9" y="248.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start" class="fade" style="animation-delay:1.50s">99</text><rect class="rise" x="210" y="280" width="78.5" height="30" rx="7" fill="#7c3aed" fill-opacity="0.85" style="animation-delay:0.75s"/><text x="198.0" y="300.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="end" >survived the refuter</text><text x="296.5" y="300.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start" class="fade" style="animation-delay:1.75s">64</text><circle class="ping" cx="288.5" cy="295" r="7" fill="none" stroke="#7c3aed" stroke-width="2" style="animation-delay:2.00s"/><text x="28.0" y="348.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >Of the closed ones 934 stop without a checkable form and 433 are rejected;</text><text x="28.0" y="367.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >the refuter breaks 35, as weaker than a known range or a repeat. Log scale.</text></svg>
