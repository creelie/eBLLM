<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Audit, triage and figure critic: 9 stages, findings substantive 4, absorbable 6, typo 23, confirmed 31, conclusion 10; 38 of 38 stored checks reproduced here"><style>@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes rise{from{transform:scaleX(0)}to{transform:scaleX(1)}}[marker-end]{stroke-dasharray:8 6;animation:flow 1.4s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.rise{transform-box:fill-box;transform-origin:left;animation:rise 1.8s cubic-bezier(.2,.8,.2,1) both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 12s linear infinite}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.fade{animation:fade .9s cubic-bezier(.2,.8,.2,1) both}@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}.sweep{transform-box:fill-box;animation:sweep 7s ease-in-out infinite}@keyframes march{to{stroke-dashoffset:-24}}.march{stroke-dasharray:3 9;animation:march 2s linear infinite}</style><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0!important}.ping,.sweep{display:none}}</style><style>@keyframes travel{0%{transform:translateX(0)}100%{transform:translateX(960px)}}.travel{animation:travel 5s cubic-bezier(.45,0,.55,1) infinite}@keyframes spin{to{transform:rotate(360deg)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}</style><rect width="1280" height="560" rx="22" fill="#161b22" stroke="#30363d"/><text x="40.0" y="50.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="4">AUDIT · TRIAGE · CRITIC</text><text x="40.0" y="78.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9da7b3" text-anchor="start" >Re-derive a published calculation stage by stage, check each stage with separate code, and sort every difference by what it does.</text><line class="march" x1="100" y1="140" x2="1060" y2="140" stroke="#fb7185" stroke-width="3"/><circle class="fade" cx="100.0" cy="140" r="15" fill="#161b22" stroke="#fb7185" stroke-width="3" style="animation-delay:0.00s"/><text x="100.0" y="145.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#fb7185" text-anchor="middle" >1</text><text x="100.0" y="176.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9da7b3" text-anchor="middle" >Feynman rules</text><circle class="fade" cx="220.0" cy="140" r="15" fill="#161b22" stroke="#fb7185" stroke-width="3" style="animation-delay:0.10s"/><text x="220.0" y="145.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#fb7185" text-anchor="middle" >2</text><text x="220.0" y="176.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9da7b3" text-anchor="middle" >4-point</text><text x="220.0" y="191.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5"