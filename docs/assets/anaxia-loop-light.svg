height="20" rx="5" fill="#d97706"/><text x="1040.0" y="217.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start" >stopped</text><text x="1230.0" y="217.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end" >1</text><rect x="1010" y="232" width="20" height="20" rx="5" fill="#94a3b8"/><text x="1040.0" y="247.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start" >not yet built</text><text x="1230.0" y="247.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end" >2</text><text x="1010.0" y="286.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#475569" text-anchor="start" >3 of the 11 changes that were</text><text x="1010.0" y="305.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#475569" text-anchor="start" >built moved their target;</text><text x="1010.0" y="324.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#475569" text-anchor="start" >3 targets closed in all.</text><text x="40.0" y="452.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start" >From src/ebllm/bllm/data/modlog.json; anaxia modlog prints it, and anaxia modlog --patterns ranks the kinds of change by what they achieved.</text></svg>
