<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="The learn-from-failure loop of Anaxia and what its changes did"><style>@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes rise{from{transform:scaleX(0)}to{transform:scaleX(1)}}[marker-end]{stroke-dasharray:8 6;animation:flow 1.4s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.rise{transform-box:fill-box;transform-origin:left;animation:rise 1.8s cubic-bezier(.2,.8,.2,1) both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 12s linear infinite}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.fade{animation:fade .9s cubic-bezier(.2,.8,.2,1) both}@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}.sweep{transform-box:fill-box;animation:sweep 7s ease-in-out infinite}@keyframes march{to{stroke-dashoffset:-24}}.march{stroke-dasharray:3 9;animation:march 2s linear infinite}</style><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0!important}.ping,.sweep{display:none}}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1280" height="470" rx="22" fill="#f8fafc" stroke="#e2e8f0"/><text x="40.0" y="50.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" >It learns from every failure</text><text x="40.0" y="76.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start" >103 attempts on 42 targets, 85 rule changes. Each change names the rule, its old and new value, and the measurement it should move.</text><path d="M366.6,149.5 A124,124 0 0 1 431.3,196.5" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><path d="M454.0,266.2 A124,124 0 0 1 429.3,342.3" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><path d="M370.0,385.4 A124,124 0 0 1 290.0,385.4" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><path d="M230.7,342.3 A124,124 0 0 1 206.0,266.2" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><path d="M228.7,196.5 A124,124 0 0 1 293.4,149.5" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><circle class="pulse" cx="330.0" cy="144.0" r="30" fill="#2563eb" style="animation-delay:0.00s"/><text x="330.0" y="149.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Attempt</text><text x="330.0" y="104.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#475569" text-anchor="middle" >under the rule book v</text><circle class="pulse" cx="447.9" cy="229.7" r="30" fill="#e11d48" style="animation-delay:0.48s"/><text x="447.9" y="234.7" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Fail</text><text x="487.9" y="279.7" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#475569" text-anchor="start" >name the part that failed</text><circle class="pulse" cx="402.9" cy="368.3" r="30" fill="#d97706" style="animation-delay:0.96s"/><text x="402.9" y="373.3" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Record</text><text x="442.9" y="418.3" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#475569" text-anchor="start" >target, evidence, diagnosis</text><circle class="pulse" cx="257.1" cy="368.3" r="30" fill="#7c3aed" style="animation-delay:1.44s"/><text x="257.1" y="373.3" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Change</text><text x="217.1" y="418.3" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#475569" text-anchor="end" >one rule, tied to a number</text><circle class="pulse" cx="212.1" cy="229.7" r="30" fill="#0d9488" style="animation-delay:1.92s"/><text x="212.1" y="234.7" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Retry</text><text x="172.1" y="279.7" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#475569" text-anchor="end" >under the rule book v+1</text><text x="330.0" y="264.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle" >85</text><text x="330.0" y="288.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle" >rule changes</text><text x="640.0" y="120.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >What was changed</text><text x="750.0" y="157.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end" >check</text><rect class="rise" x="760" y="142" width="200.0" height="20" rx="5" fill="#7c3aed" fill-opacity="0.85" style="animation-delay:0.00s"/><text x="968.0" y="157.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >19</text><text x="750.0" y="187.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end" >strategy</text><rect class="rise" x="760" y="172" width="178.9" height="20" rx="5" fill="#7c3aed" fill-opacity="0.85" style="animation-delay:0.12s"/><text x="946.9" y="187.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >17</text><text x="750.0" y="217.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end" >representation</text><rect class="rise" x="760" y="202" width="168.4" height="20" rx="5" fill="#7c3aed" fill-opacity="0.85" style="animation-delay:0.24s"/><text x="936.4" y="217.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >16</text><text x="750.0" y="247.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end" >scope</text><rect class="rise" x="760" y="232" width="105.3" height="20" rx="5" fill="#7c3aed" fill-opacity="0.85" style="animation-delay:0.36s"/><text x="873.3" y="247.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >10</text><text x="750.0" y="277.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end" >reduction</text><rect class="rise" x="760" y="262" width="84.2" height="20" rx="5" fill="#7c3aed" fill-opacity="0.85" style="animation-delay:0.48s"/><text x="852.2" y="277.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >8</text><text x="750.0" y="307.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end" >library</text><rect class="rise" x="760" y="292" width="63.2" height="20" rx="5" fill="#7c3aed" fill-opacity="0.85" style="animation-delay:0.60s"/><text x="831.2" y="307.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >6</text><text x="750.0" y="337.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end" >mode</text><rect class="rise" x="760" y="322" width="42.1" height="20" rx="5" fill="#7c3aed" fill-opacity="0.85" style="animation-delay:0.72s"/><text x="810.1" y="337.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >4</text><text x="750.0" y="367.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end" >budget</text><rect class="rise" x="760" y="352" width="31.6" height="20" rx="5" fill="#7c3aed" fill-opacity="0.85" style="animation-delay:0.84s"/><text x="799.6" y="367.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >3</text><text x="750.0" y="397.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end" >retrieval</text><rect class="rise" x="760" y="382" width="21.1" height="20" rx="5" fill="#7c3aed" fill-opacity="0.85" style="animation-delay:0.96s"/><text x="789.1" y="397.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >2</text><text x="1010.0" y="120.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >The retry</text><rect x="1010" y="142" width="20" height="20" rx="5" fill="#0d9488"/><text x="1040.0" y="157.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start" >closed</text><text x="1230.0" y="157.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end" >10</text><rect x="1010" y="172" width="20" height="20" rx="5" fill="#2563eb"/><text x="1040.0" y="187.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start" >partial</text><text x="1230.0" y="187.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end" >25</text><rect x="1010" y="202" width="20" height="20" rx="5" fill="#e11d48"/><text x="1040.0" y="217.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start" >failed</text><text x="1230.0" y="217.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end" >19</text><rect x="1010" y="232" width="20" height="20" rx="5" fill="#d97706"/><text x="1040.0" y="247.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start" >stopped</text><text x="1230.0" y="247.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end" >7</text><rect x="1010" y="262" width="20" height="20" rx="5" fill="#94a3b8"/><text x="1040.0" y="277.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start" >not yet built</text><text x="1230.0" y="277.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end" >24</text><text x="1010.0" y="316.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#475569" text-anchor="start" >35 of the 61 changes that were</text><text x="1010.0" y="335.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#475569" text-anchor="start" >built moved their target;</text><text x="1010.0" y="354.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#475569" text-anchor="start" >11 targets closed in all.</text><text x="40.0" y="452.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start" >From src/ebllm/bllm/data/modlog.json; anaxia modlog prints it, and anaxia modlog --patterns ranks the kinds of change by what they achieved.</text></svg>
