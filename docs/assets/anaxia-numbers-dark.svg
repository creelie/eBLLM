<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 388" width="1280" height="388" role="img" aria-label="Six numbers from the runs of Anaxia"><clipPath id="c0"><rect x="12.0" y="10.0" width="408.0" height="176.0" rx="16"/></clipPath><rect x="12.0" y="10.0" width="408.0" height="176.0" rx="16" fill="#161b22" stroke="#30363d"/><rect x="12.0" y="10.0" width="7" height="176.0" fill="#a78bfa" clip-path="url(#c0)"/><text x="40.0" y="68.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#a78bfa" text-anchor="start" >21,515 → 64</text><text x="40.0" y="104.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >composites bred to depth four in the</text><text x="40.0" y="126.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >amplified round; 64 pass their check</text><text x="40.0" y="148.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >and survive the refuter</text><clipPath id="c1"><rect x="436.0" y="10.0" width="408.0" height="176.0" rx="16"/></clipPath><rect x="436.0" y="10.0" width="408.0" height="176.0" rx="16" fill="#161b22" stroke="#30363d"/><rect x="436.0" y="10.0" width="7" height="176.0" fill="#2dd4bf" clip-path="url(#c1)"/><text x="464.0" y="68.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#2dd4bf" text-anchor="start" >46.4 vs 95.2</text><text x="464.0" y="104.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >checks to the same plateau with</text><text x="464.0" y="126.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >memory and without it: nothing</text><text x="464.0" y="148.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >decided is checked twice</text><clipPath id="c2"><rect x="860.0" y="10.0" width="408.0" height="176.0" rx="16"/></clipPath><rect x="860.0" y="10.0" width="408.0" height="176.0" rx="16" fill="#161b22" stroke="#30363d"/><rect x="860.0" y="10.0" width="7" height="176.0" fill="#fbbf24" clip-path="url(#c2)"/><text x="888.0" y="68.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#fbbf24" text-anchor="start" >1.08 vs 1.5–4.3</text><text x="888.0" y="104.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >human research ideas against nine</text><text x="888.0" y="126.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >language models, in multiples of the</text><text x="888.0" y="148.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >proposer bound</text><clipPath id="c3"><rect x="12.0" y="202.0" width="408.0" height="176.0" rx="16"/></clipPath><rect x="12.0" y="202.0" width="408.0" height="176.0" rx="16" fill="#161b22" stroke="#30363d"/><rect x="12.0" y="202.0" width="7" height="176.0" fill="#60a5fa" clip-path="url(#c3)"/><text x="40.0" y="260.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#60a5fa" text-anchor="start" >≤ 348 steps</text><text x="40.0" y="296.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >every reflexive descent of each of the</text><text x="40.0" y="318.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >473,800,776 reflexive 4-polytopes</text><text x="40.0" y="340.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >reaches a seed: the conjecture holds</text><clipPath id="c4"><rect x="436.0" y="202.0" width="408.0" height="176.0" rx="16"/></clipPath><rect x="436.0" y="202.0" width="408.0" height="176.0" rx="16" fill="#161b22" stroke="#30363d"/><rect x="436.0" y="202.0" width="7" height="176.0" fill="#a78bfa" clip-path="url(#c4)"/><text x="464.0" y="260.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#a78bfa" text-anchor="start" >18 changes</text><text x="464.0" y="296.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >of its own rules, after 20 attempts</text><text x="464.0" y="318.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >that did not close; 7 of the 16</text><text x="464.0" y="340.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >changes it built moved their target</text><clipPath id="c5"><rect x="860.0" y="202.0" width="408.0" height="176.0" rx="16"/></clipPath><rect x="860.0" y="202.0" width="408.0" height="176.0" rx="16" fill="#161b22" stroke="#30363d"/><rect x="860.0" y="202.0" width="7" height="176.0" fill="#fb7185" clip-path="url(#c5)"/><text x="888.0" y="260.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#fb7185" text-anchor="start" >1 of 6</text><text x="888.0" y="296.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >benchmarks crossed: the seed</text><text x="888.0" y="318.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >conjecture. Yang–Mills, Hodge, B,</text><text x="888.0" y="340.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >Chowla, Erdős 1183 stay open</text></svg>
