<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 388" width="1280" height="388" role="img" aria-label="Six numbers from the runs of Anaxia"><style>@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes rise{from{transform:scaleX(0)}to{transform:scaleX(1)}}[marker-end]{stroke-dasharray:8 6;animation:flow 1.4s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.rise{transform-box:fill-box;transform-origin:left;animation:rise 1.8s cubic-bezier(.2,.8,.2,1) both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 12s linear infinite}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.fade{animation:fade .9s cubic-bezier(.2,.8,.2,1) both}@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}.sweep{transform-box:fill-box;animation:sweep 7s ease-in-out infinite}@keyframes march{to{stroke-dashoffset:-24}}.march{stroke-dasharray:3 9;animation:march 2s linear infinite}</style><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0!important}.ping,.sweep{display:none}}</style><defs><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0.35" stop-color="#a78bfa" stop-opacity="0"/><stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.10"/><stop offset="0.65" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs><clipPath id="c0"><rect x="12.0" y="10.0" width="408.0" height="176.0" rx="16"/></clipPath><g class="fade" style="animation-delay:0.00s"><rect x="12.0" y="10.0" width="408.0" height="176.0" rx="16" fill="#161b22" stroke="#30363d"/><g clip-path="url(#c0)"><rect class="sweep" x="12.0" y="10.0" width="408.0" height="176.0" fill="url(#sheen)" style="animation-delay:0.00s"/></g><rect class="grow" x="12.0" y="10.0" width="7" height="176.0" fill="#a78bfa" clip-path="url(#c0)" style="animation-delay:0.30s"/><text x="40.0" y="68.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#a78bfa" text-anchor="start" >21,515 → 64</text><text x="40.0" y="104.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >composites bred to depth four in the</text><text x="40.0" y="126.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >amplified round; 64 pass their check</text><text x="40.0" y="148.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >and survive the refuter</text></g><clipPath id="c1"><rect x="436.0" y="10.0" width="408.0" height="176.0" rx="16"/></clipPath><g class="fade" style="animation-delay:0.15s"><rect x="436.0" y="10.0" width="408.0" height="176.0" rx="16" fill="#161b22" stroke="#30363d"/><g clip-path="url(#c1)"><rect class="sweep" x="436.0" y="10.0" width="408.0" height="176.0" fill="url(#sheen)" style="animation-delay:1.20s"/></g><rect class="grow" x="436.0" y="10.0" width="7" height="176.0" fill="#2dd4bf" clip-path="url(#c1)" style="animation-delay:0.45s"/><text x="464.0" y="68.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#2dd4bf" text-anchor="start" >46.4 vs 95.2</text><text x="464.0" y="104.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >checks to the same plateau with</text><text x="464.0" y="126.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >memory and without it: nothing</text><text x="464.0" y="148.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >decided is checked twice</text></g><clipPath id="c2"><rect x="860.0" y="10.0" width="408.0" height="176.0" rx="16"/></clipPath><g class="fade" style="animation-delay:0.30s"><rect x="860.0" y="10.0" width="408.0" height="176.0" rx="16" fill="#161b22" stroke="#30363d"/><g clip-path="url(#c2)"><rect class="sweep" x="860.0" y="10.0" width="408.0" height="176.0" fill="url(#sheen)" style="animation-delay:2.40s"/></g><rect class="grow" x="860.0" y="10.0" width="7" height="176.0" fill="#fbbf24" clip-path="url(#c2)" style="animation-delay:0.60s"/><text x="888.0" y="68.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#fbbf24" text-anchor="start" >1.08 vs 1.5–4.3</text><text x="888.0" y="104.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >human research ideas against nine</text><text x="888.0" y="126.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >language models, in multiples of the</text><text x="888.0" y="148.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >proposer bound</text></g><clipPath id="c3"><rect x="12.0" y="202.0" width="408.0" height="176.0" rx="16"/></clipPath><g class="fade" style="animation-delay:0.45s"><rect x="12.0" y="202.0" width="408.0" height="176.0" rx="16" fill="#161b22" stroke="#30363d"/><g clip-path="url(#c3)"><rect class="sweep" x="12.0" y="202.0" width="408.0" height="176.0" fill="url(#sheen)" style="animation-delay:3.60s"/></g><rect class="grow" x="12.0" y="202.0" width="7" height="176.0" fill="#60a5fa" clip-path="url(#c3)" style="animation-delay:0.75s"/><text x="40.0" y="260.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#60a5fa" text-anchor="start" >≤ 348 steps</text><text x="40.0" y="296.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >every reflexive descent of each of the</text><text x="40.0" y="318.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >473,800,776 reflexive 4-polytopes</text><text x="40.0" y="340.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >reaches a seed: the conjecture holds</text></g><clipPath id="c4"><rect x="436.0" y="202.0" width="408.0" height="176.0" rx="16"/></clipPath><g class="fade" style="animation-delay:0.60s"><rect x="436.0" y="202.0" width="408.0" height="176.0" rx="16" fill="#161b22" stroke="#30363d"/><g clip-path="url(#c4)"><rect class="sweep" x="436.0" y="202.0" width="408.0" height="176.0" fill="url(#sheen)" style="animation-delay:4.80s"/></g><rect class="grow" x="436.0" y="202.0" width="7" height="176.0" fill="#a78bfa" clip-path="url(#c4)" style="animation-delay:0.90s"/><text x="464.0" y="260.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#a78bfa" text-anchor="start" >89 changes</text><text x="464.0" y="296.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >of its own rules, after 96 attempts</text><text x="464.0" y="318.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >that did not close; 38 of the 65</text><text x="464.0" y="340.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >changes it built moved their target</text></g><clipPath id="c5"><rect x="860.0" y="202.0" width="408.0" height="176.0" rx="16"/></clipPath><g class="fade" style="animation-delay:0.75s"><rect x="860.0" y="202.0" width="408.0" height="176.0" rx="16" fill="#161b22" stroke="#30363d"/><g clip-path="url(#c5)"><rect class="sweep" x="860.0" y="202.0" width="408.0" height="176.0" fill="url(#sheen)" style="animation-delay:6.00s"/></g><rect class="grow" x="860.0" y="202.0" width="7" height="176.0" fill="#fb7185" clip-path="url(#c5)" style="animation-delay:1.05s"/><text x="888.0" y="260.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#fb7185" text-anchor="start" >0 of 4</text><text x="888.0" y="296.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >target conjectures closed in full:</text><text x="888.0" y="318.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >strings, seeds, Hodge, Yang–Mills;</text><text x="888.0" y="340.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#9da7b3" text-anchor="start" >the seed bound is a sub-benchmark</text></g></svg>
