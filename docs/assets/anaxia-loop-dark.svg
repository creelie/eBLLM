<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="The learn-from-failure loop of Anaxia and what its changes did"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs><rect width="1280" height="470" rx="22" fill="#161b22" stroke="#30363d"/><text x="40.0" y="50.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="start" >It learns from every failure</text><text x="40.0" y="76.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9da7b3" text-anchor="start" >25 attempts on 9 targets, 18 rule changes. Each change names the rule, its old and new value, and the measurement it should move.</text><path d="M366.6,149.5 A124,124 0 0 1 431.3,196.5" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#ar)"/><path d="M454.0,266.2 A124,124 0 0 1 429.3,342.3" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#ar)"/><path d="M370.0,385.4 A124,124 0 0 1 290.0,385.4" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#ar)"/><path d="M230.7,342.3 A124,124 0 0 1 206.0,266.2" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#ar)"/><path d="M228.7,196.5 A124,124 0 0 1 293.4,149.5" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#ar)"/><circle cx="330.0" cy="144.0" r="30" fill="#60a5fa"/><text x="330.0" y="149.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Attempt</text><text x="330.0" y="104.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#9da7b3" text-anchor="middle" >under the rule book v</text><circle cx="447.9" cy="229.7" r="30" fill="#fb7185"/><text x="447.9" y="234.7" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Fail</text><text x="487.9" y="279.7" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#9da7b3" text-anchor="start" >name the part that failed</text><circle cx="402.9" cy="368.3" r="30" fill="#fbbf24"/><text x="402.9" y="373.3" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Record</text><text x="442.9" y="418.3" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#9da7b3" text-anchor="start" >target, evidence, diagnosis</text><circle cx="257.1" cy="368.3" r="30" fill="#a78bfa"/><text x="257.1" y="373.3" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Change</text><text x="217.1" y="418.3" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#9da7b3" text-anchor="end" >one rule, tied to a number</text><circle cx="212.1" cy="229.7" r="30" fill="#2dd4bf"/><text x="212.1" y="234.7" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Retry</text><text x="172.1" y="279.7" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#9da7b3" text-anchor="end" >under the rule book v+1</text><text x="330.0" y="264.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#e6edf3" text-anchor="middle" >18</text><text x="330.0" y="288.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#