#e6edf3" text-anchor="start" >2</text><text x="750.0" y="277.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end" >mode</text><rect x="760" y="262" width="33.3" height="20" rx="5" fill="#a78bfa" fill-opacity="0.85"/><text x="801.3" y="277.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" >1</text><text x="750.0" y="307.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end" >retrieval</text><rect x="760" y="292" width="33.3" height="20" rx="5" fill="#a78bfa" fill-opacity="0.85"/><text x="801.3" y="307.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" >1</text><text x="1010.0" y="120.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >The retry</text><rect x="1010" y="142" width="20" height="20" rx="5" fill="#2dd4bf"/><text x="1040.0" y="157.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" >closed</text><text x="1230.0" y="157.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="end" >4</text><rect x="1010" y="172" width="20" height="20" rx="5" fill="#60a5fa"/><text x="1040.0" y="187.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" >partial</text><text x="1230.0" y="187.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="end" >3</text><rect x="1010" y="202" width="20" height="20" rx="5" fill="#fb7185"/><text x="1040.0" y="217.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" >failed</text><text x="1230.0" y="217.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="end" >8</text><rect x="1010" y="232" width="20" height="20" rx="5" fill="#fbbf24"/><text x="1040.0" y="247.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" >stopped</text><text x="1230.0" y="247.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="end" >1</text><rect x="1010" y="262" width="20" height="20" rx="5" fill="#6e7681"/><text x="1040.0" y="277.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" >not yet built</text><text x="1230.0" y="277.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="end" >2</text><text x="1010.0" y="316.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#9da7b3" text-anchor="start" >7 of the 16 changes that were</text><text x="1010.0" y="335.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#9da7b3" text-anchor="start" >built moved their target;</text><text x="1010.0" y="354.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#9da7b3" text-anchor="start" >5 targets closed in all.</text><text x="40.0" y="452.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e7681" text-anchor="start" >From src/ebllm/bllm/data/modlog.json; anaxia modlog prints it, and anaxia modlog --patterns ranks the kinds of change by what they achieved.</text></svg>
