<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 118" width="1280" height="118" role="img" aria-label="Audits · Triage · Figure Critic: Check a published calculation stage by stage; decide go or no-go before an attack."><style>@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes rise{from{transform:scaleX(0)}to{transform:scaleX(1)}}[marker-end]{stroke-dasharray:8 6;animation:flow 1.4s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.rise{transform-box:fill-box;transform-origin:left;animation:rise 1.8s cubic-bezier(.2,.8,.2,1) both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 12s linear infinite}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.fade{animation:fade .9s cubic-bezier(.2,.8,.2,1) both}@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}.sweep{transform-box:fill-box;animation:sweep 7s ease-in-out infinite}@keyframes march{to{stroke-dashoffset:-24}}.march{stroke-dasharray:3 9;animation:march 2s linear infinite}</style><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0!important}.ping,.sweep{display:none}}</style><style>@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b1640"/><stop offset=".55" stop-color="#161b22"/><stop offset="1" stop-color="#0b1020"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset=".4" stop-color="#fb7185" stop-opacity="0"/><stop offset=".5" stop-color="#fb7185" stop-opacity=".12"/><stop offset=".6" stop-color="#fb7185" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect x="1" y="1" width="1278" height="116" rx="18"/></clipPath></defs><rect x="1" y="1" width="1278" height="116" rx="18" fill="url(#bg)" stroke="#30363d"/><g clip-path="url(#clip)"><rect class="sweep" x="0" y="0" width="1280" height="118" fill="url(#sheen)"/><rect class="grow" x="0" y="0" width="8" height="118" fill="#fb7185"/></g><circle cx="84" cy="59.0" r="44" fill="#fb7185" fill-opacity=".08"/><rect x="60" y="29.0" width="40" height="52" rx="5" fill="#fb7185" fill-opacity=".1" stroke="#fb7185" stroke-width="2.5"/><line class="draw" pathLength="1" x1="68" y1="41.0" x2="92" y2="41.0" stroke="#fb7185" stroke-width="2" stroke-linecap="round" style="animation-delay:0.00s"/><line class="draw" pathLength="1" x1="68" y1="52.0" x2="92" y2="52.0" stroke="#fb7185" stroke-width="2" stroke-linecap="round" style="animation-delay:0.15s"/><line class="draw" pathLength="1" x1="68" y1="63.0" x2="92" y2="63.0" stroke="#fb7185" stroke-width="2" stroke-linecap="round" style="animation-delay:0.30s"/><line class="draw" pathLength="1" x1="68" y1="74.0" x2="92" y2="74.0" stroke="#fb7185" stroke-width="2" stroke-linecap="round" style="animation-delay:0.45s"/><circle cx="98" cy="73.0" r="12" fill="#161b22" stroke="#fb7185" stroke-width="3"/><line x1="107" y1="82.0" x2="117" y2="92.0" stroke="#fb7185" stroke-width="4" stroke-linecap="round"/><circle class="ping" cx="98" cy="73.0" r="12" fill="none" stroke="#fb7185" stroke-width="2"/><text x="160.0" y="48.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="3" class="fade">AUDITS · TRIAGE · FIGURE CRITIC</text><text x="160.0" y="82.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3" text-anchor="start" class="fade" style="animation-delay:0.15s">Check a published calculation stage by stage; decide go or no-go before an attack.</text><line class="march" x1="160" y1="104" x2="1240" y2="104" stroke="#fb7185" stroke-opacity=".5" stroke-width="2"/><text x="1240.0" y="48.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#6e7681" text-anchor="end" class="fade" style="animation-delay:0.30s">anaxia audit · anaxia triage</text></svg>
