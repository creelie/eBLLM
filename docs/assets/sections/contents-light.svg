<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 118" width="1280" height="118" role="img" aria-label="Contents: Every part of the engine, in the order a round uses them."><style>@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes rise{from{transform:scaleX(0)}to{transform:scaleX(1)}}[marker-end]{stroke-dasharray:8 6;animation:flow 1.4s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.rise{transform-box:fill-box;transform-origin:left;animation:rise 1.8s cubic-bezier(.2,.8,.2,1) both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 12s linear infinite}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.fade{animation:fade .9s cubic-bezier(.2,.8,.2,1) both}@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}.sweep{transform-box:fill-box;animation:sweep 7s ease-in-out infinite}@keyframes march{to{stroke-dashoffset:-24}}.march{stroke-dasharray:3 9;animation:march 2s linear infinite}</style><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0!important}.ping,.sweep{display:none}}</style><style>@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef2ff"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#ffffff"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset=".4" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".5" stop-color="#7c3aed" stop-opacity=".12"/><stop offset=".6" stop-color="#7c3aed" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect x="1" y="1" width="1278" height="116" rx="18"/></clipPath></defs><rect x="1" y="1" width="1278" height="116" rx="18" fill="url(#bg)" stroke="#e2e8f0"/><g clip-path="url(#clip)"><rect class="sweep" x="0" y="0" width="1280" height="118" fill="url(#sheen)"/><rect class="grow" x="0" y="0" width="8" height="118" fill="#7c3aed"/></g><circle cx="84" cy="59.0" r="44" fill="#7c3aed" fill-opacity=".08"/><line class="march" x1="58" y1="41.0" x2="84" y2="59.0" stroke="#7c3aed" stroke-width="2"/><line class="march" x1="108" y1="37.0" x2="84" y2="59.0" stroke="#7c3aed" stroke-width="2"/><line class="march" x1="64" y1="81.0" x2="84" y2="59.0" stroke="#7c3aed" stroke-width="2"/><line class="march" x1="110" y1="75.0" x2="84" y2="59.0" stroke="#7c3aed" stroke-width="2"/><line class="march" x1="58" y1="41.0" x2="108" y2="37.0" stroke="#7c3aed" stroke-width="2"/><line class="march" x1="64" y1="81.0" x2="110" y2="75.0" stroke="#7c3aed" stroke-width="2"/><circle class="fade" cx="58" cy="41.0" r="5" fill="#7c3aed" style="animation-delay:0.00s"/><circle class="fade" cx="108" cy="37.0" r="5" fill="#7c3aed" style="animation-delay:0.12s"/><circle class="fade" cx="64" cy="81.0" r="5" fill="#7c3aed" style="animation-delay:0.24s"/><circle class="fade" cx="110" cy="75.0" r="5" fill="#7c3aed" style="animation-delay:0.36s"/><circle class="fade" cx="84" cy="59.0" r="8" fill="#7c3aed" style="animation-delay:0.48s"/><circle class="ping" cx="84" cy="59.0" r="9" fill="none" stroke="#7c3aed" stroke-width="2"/><text x="160.0" y="48.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start" letter-spacing="3" class="fade">CONTENTS</text><text x="160.0" y="82.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a" text-anchor="start" class="fade" style="animation-delay:0.15s">Every part of the engine, in the order a round uses them.</text><line class="march" x1="160" y1="104" x2="1240" y2="104" stroke="#7c3aed" stroke-opacity=".5" stroke-width="2"/></svg>
