nt-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="end" class="fade" style="animation-delay:0.30s">anaxia construct</text></svg>
