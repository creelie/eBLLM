<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 118" width="1280" height="118" role="img" aria-label="Checks: What continuous integration runs on every push: Python, C, C++, Julia, Lean."><style>@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes rise{from{transform:scaleX(0)}to{transform:scaleX(1)}}[marker-end]{stroke-dasharray:8 6;animation:flow 1.4s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.rise{transform-box:fill-box;transform-origin:left;animation:rise 1.8s cubic-bezier(.2,.8,.2,1) both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 12s linear infinite}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.fade{animation:fade .9s cubic-bezier(.2,.8,.2,1) both}@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}.sweep{transform-box:fill-box;animation:sweep 7s ease-in-out infinite}@keyframes march{to{stroke-dashoffset:-24}}.march{stroke-dasharray:3 9;animation:march 2s linear infinite}</style><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0!important}.ping,.sweep{display:none}}</style><style>@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}</style><defs><linearGradient 