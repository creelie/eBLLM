<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" width="1280" height="200" role="img" aria-label="Four numbers from the runs of Anaxia"><rect x="12" y="10" width="299" height="180" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><rect x="12" y="10" width="6" height="180" rx="3" fill="#7c3aed"/><text x="38.0" y="70.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#7c3aed" text-anchor="start" >21,515 → 64</text><text x="38.0" y="106.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >composites bred to depth four in the</text><text x="38.0" y="128.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >amplified round; 64 pass their check</text><text x="38.0" y="150.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >and survive the refuter</text><rect x="327" y="10" width="299" height="180" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><rect x="327" y="10" width="6" height="180" rx="3" fill="#0d9488"/><text x="353.0" y="70.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="33.9" font-weight="700" fill="#0d9488" text-anchor="start" >46.4 vs 95.2</text><text x="353.0" y="106.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >checks to the same plateau with</text><text x="353.0" y="128.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >memory and without it: nothing</text><text x="353.0" y="150.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >decided is checked twice</text><rect x="642" y="10" width="299" height="180" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><rect x="642" y="10" width="6" height="180" rx="3" fill="#d97706"/><text x="668.0" y="70.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="27.1" font-weight="700" fill="#d97706" text-anchor="start" >1.08 vs 1.5–4.3</text><text x="668.0" y="106.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >human research ideas against nine</text><text x="668.0" y="128.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >language models, in multiples of the</text><text x="668.0" y="150.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >proposer bound</text><rect x="957" y="10" width="299" height="180" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><rect x="957" y="10" width="6" height="180" rx="3" fill="#e11d48"/><text x="983.0" y="70.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#e11d48" text-anchor="start" >0 of 5</text><text x="983.0" y="106.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >open problems solved: Yang–Mills,</text><text x="983.0" y="128.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >Hodge, standard conjecture B,</text><text x="983.0" y="150.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >Chowla, Erdős 1183</text></svg>
