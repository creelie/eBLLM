 sans-serif" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start" >Check</text><text x="676.0" y="174.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >a program decides a</text><text x="676.0" y="193.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >closed composite:</text><text x="676.0" y="213.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >accepted, rejected</text><text x="676.0" y="232.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >or stopped</text><path d="M658,262 h182 v20 a14,14 0 0 1 -14,14 h-154 a14,14 0 0 1 -14,-14 z" fill="#2dd4bf" fill-opacity="0.13"/><text x="676.0" y="284.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2dd4bf" text-anchor="start" >1,466 closed → 99 accepted</text><rect x="864" y="110" width="182" height="186" rx="14" fill="#0d1117" stroke="#30363d"/><circle cx="890" cy="138" r="14" fill="#fb7185"/><text x="890.0" y="143.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text><text x="914.0" y="144.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start" >Refuter</text><text x="882.0" y="174.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >breaks it when a</text><text x="882.0" y="193.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >stronger result is</text><text x="882.0" y="213.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >known or it repeats</text><text x="882.0" y="232.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >an accepted one</text><path d="M864,262 h182 v20 a14,14 0 0 1 -14,14 h-154 a14,14 0 0 1 -14,-14 z" fill="#fb7185" fill-opacity="0.13"/><text x="882.0" y="284.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fb7185" text-anchor="start" >35 broken · 64 survive</text><rect x="1070" y="110" width="182" height="186" rx="14" fill="#0d1117" stroke="#30363d"/><circle cx="1096" cy="138" r="14" fill="#a78bfa"/><text x="1096.0" y="143.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text><text x="1120.0" y="144.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start" >Lean</text><text x="1088.0" y="174.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >kernel check and</text><text x="1088.0" y="193.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >axiom audit of what</text><text x="1088.0" y="213.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >is stated as proved;</text><text x="1088.0" y="232.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >no native_decide</text><path d=