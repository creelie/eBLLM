nt-size="12.5" font-weight="700" fill="#2dd4bf" text-anchor="start" >46.4 checks against 95.2 without it</text><rect x="40" y="404" width="388" height="126" rx="14" fill="#0d1117" stroke="#30363d"/><circle cx="66" cy="432" r="14" fill="#fbbf24"/><text x="66.0" y="437.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >8</text><text x="90.0" y="438.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start" >Boosters</text><text x="58.0" y="468.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >Hebbian weights on the synapses between</text><text x="58.0" y="487.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9da7b3" text-anchor="start" >constructions, raised by survivors</text><path d="M40,496 h388 v20 a14,14 0 0 1 -14,14 h-360 a14,14 0 0 1 -14,-14 z" fill="#fbbf24" fill-opacity="0.13"/><text x="58.0" y="518.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="start" >12 and 14 of 200 runs against 21: no gain</text><path d="M749.0,300 L749.0,398" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#ar)"/><path d="M955.0,300 L955.0,398" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#ar)"/><path d="M1161.0,300 L1161.0,398" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#ar)"/><path d="M448,454 L436,454" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#ar)"/><path d="M337.0,398 L337.0,302" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#ar)"/><path d="M192,398 C212,344 492,354 502,302" fill="none" stroke="#6e7681" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><text x="347.0" y=