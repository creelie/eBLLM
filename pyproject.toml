[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ebllm"
version = "3.1.1"
description = "Anaxia, the BLLM engine: it crosses typed mathematical constructions, keeps only what independent checks, a refuter and the Lean kernel accept, remembers every verdict, and changes one of its own rules after each failed attempt"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Deep Bhattacharjee", email = "d.bhattacharjee@erl-forschung.de"}]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
construct = ["networkx>=2.6", "python-sat>=0.1.8.dev0", "numpy>=1.21"]

[project.urls]
Repository = "https://github.com/creelie/eBLLM"

[project.scripts]
anaxia = "ebllm.cli:main"
ebllm = "ebllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebllm = ["controls/*.json", "bllm/data/*.json", "bllm/data/deepmind/*.json", "bllm/data/deepmind/*.json.gz", "bllm/tasks/*.json", "construct/data/*", "bllm/data/external/*.json.gz"]
