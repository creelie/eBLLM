name: paper checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      target:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  paper:
    name: Paper numerical checks, Lean audit and PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install paper dependencies
        run: |
          python -m pip install numpy mpmath
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-publishers texlive-fonts-recommended
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the paper and its formal dependency scope
        run: |
          mkdir -p build
          set -o pipefail
          bash paper/bllm/checks/run_all.sh | tee build/paper-checks.log
          (cd paper/bllm/lean && lake env lean Axioms.lean) > build/paper-axioms.log 2>&1
          PYTHONPATH=src python -m ebllm axioms build/paper-axioms.log "$(grep -c '^#print axioms' paper/bllm/lean/Axioms.lean)"
      - name: Compile the integrated paper
        working-directory: paper/bllm/paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Keep paper checks and compiled manuscript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-checks
          path: |
            build/paper-*.log
            paper/bllm/paper/main.pdf
            paper/bllm/paper/main.log
          if-no-files-found: ignore
