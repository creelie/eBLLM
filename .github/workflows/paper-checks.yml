name: paper checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      target:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  paper:
    name: Paper numerical checks, Lean audit and PDF integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install paper dependencies
        run: |
          python -m pip install numpy mpmath pypdf
          curl --connect-timeout 20 --max-time 120 --retry 3 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the paper and its formal dependency scope
        run: |
          mkdir -p build
          set -o pipefail
          bash paper/bllm/checks/run_all.sh | tee build/paper-checks.log
          (cd paper/bllm/lean && lake env lean Axioms.lean) > build/paper-axioms.log 2>&1
          PYTHONPATH=src python -m ebllm axioms build/paper-axioms.log "$(grep -c '^#print axioms' paper/bllm/lean/Axioms.lean)"
      - name: Check the locally compiled and visually reviewed paper
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from pypdf import PdfReader
          report = json.loads(Path('preprints/QA-2026-10-23.json').read_text())
          assert not report['outside_page_words'] and not report['layout_warnings']
          for path in ('preprints/BLLM.pdf', 'preprintBLLM/BLLM.pdf'):
              pdf = Path(path)
              assert hashlib.sha256(pdf.read_bytes()).hexdigest() == report['pdf_sha256']
              reader = PdfReader(pdf)
              assert len(reader.pages) == report['pages']
              assert all(page.extract_text().strip() for page in reader.pages)
          PY
      - name: Keep paper checks and compiled manuscript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-checks
          path: |
            build/paper-*.log
            preprints/BLLM.pdf
            preprints/QA-2026-10-23.json
          if-no-files-found: ignore
