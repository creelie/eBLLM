name: package

# Builds Anaxia, the BLLM engine, as a container image from the Dockerfile and publishes it to the
# GitHub Container Registry as ghcr.io/creelie/bllm-engine, tagged with the package version and
# latest. Runs on every push to main (so the image follows main), on every release tag, and by
# hand from the Actions tab. The image is published only after the version, the CLI and the Lean
# axiom audit pass inside it. The index carries the version, the commit and the build time, which
# a running copy compares with its own to tell whether latest is newer (`anaxia update`).

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the package version and the build time
        id: version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          grep -q "__version__ = \"$v\"" src/ebllm/__init__.py
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.version.outputs.created }}
          tags: bllm-engine:candidate
      - name: Check the image
        env:
          ANAXIA_NO_UPDATE_CHECK: "1"
        run: |
          docker run --rm -e ANAXIA_NO_UPDATE_CHECK bllm-engine:candidate --version | grep -qx "anaxia ${{ steps.version.outputs.version }}"
          docker run --rm -e ANAXIA_NO_UPDATE_CHECK bllm-engine:candidate controls > /dev/null
          docker run --rm -e ANAXIA_NO_UPDATE_CHECK --entrypoint bash bllm-engine:candidate -c "cd lean && lake build && lake env lean Audit.lean > /tmp/audit.log && anaxia axioms /tmp/audit.log 30"
          docker run --rm --entrypoint bash bllm-engine:candidate -c 'test "$ANAXIA_REVISION" = "${{ github.sha }}" && test -n "$ANAXIA_CREATED"'
      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.version.outputs.created }}
          tags: |
            ghcr.io/creelie/bllm-engine:${{ steps.version.outputs.version }}
            ghcr.io/creelie/bllm-engine:latest
          annotations: |
            index:org.opencontainers.image.title=Anaxia
            index:org.opencontainers.image.description=Anaxia, the BLLM engine: verifier-gated conjecture closure and the BLLM crossing network (eBLLM), with its Lean 4 library, checks, target agents, memory and the BLLM paper
            index:org.opencontainers.image.authors=Deep Bhattacharjee
            index:org.opencontainers.image.source=https://github.com/creelie/eBLLM
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.version=${{ steps.version.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.created=${{ steps.version.outputs.created }}
