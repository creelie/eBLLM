name: release

# Run by hand from the Actions tab after the PR is merged: it runs the checks, builds the sdist
# and the wheel, tags the chosen commit and publishes a GitHub release with both files attached,
# then starts the image build for the new tag (a tag made with the workflow token does not start
# other workflows by itself). Zenodo archives the release and mints a DOI if the repository is
# switched on at https://zenodo.org/account/settings/github/.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$TAG" || { echo "tag $TAG but pyproject.toml has $v"; exit 1; }
          grep -q "__version__ = \"$v\"" src/ebllm/__init__.py
          python -m json.tool .zenodo.json > /dev/null
      - name: Tests
        run: |
          python -m pip install networkx python-sat
          PYTHONPATH=src python -m unittest discover -s tests
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$TARGET" \
            --title "$TAG: BLLM: Beyond the LLM with Deep Human-Mind-AI" \
            --notes-file .github/RELEASE_NOTES.md
      - name: Build and publish the image for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run package.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
